spring.config.import=optional:file:./.env[.properties],optional:file:./backend/.env[.properties]

server.port=${SERVER_PORT:8080}

spring.application.name=experts-voyage-api
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/expert_voyages?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jackson.time-zone=UTC

app.cors.allowed-origin=${FRONTEND_ORIGIN:http://localhost:5173}
app.reservation.hold-minutes=${RESERVATION_HOLD_MINUTES:15}
app.jwt.secret=${JWT_SECRET}
app.jwt.access-token-minutes=${JWT_ACCESS_TOKEN_MINUTES:15}
app.jwt.refresh-token-days=${JWT_REFRESH_TOKEN_DAYS:7}
